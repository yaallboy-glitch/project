<script>
const API = "https://kegiatan-api.newbrigademudasoropati.workers.dev";
const token = localStorage.getItem("token") || "";
if (!token) { location.href = "index.html"; }

// ===== IKON (SVG line-icon simpel, senada dengan ikon sidebar) =====
const ICON = {
  warning: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:5px;flex:0 0 auto"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`,
  trash:   `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
  download:`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>`,
  refresh: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`,
};

const ROLE_LABEL_MAP = { admin:"Admin", bendahara:"Bendahara", pdd:"PDD", ketua:"Ketua", anggota:"Anggota" };
function roleLabel(role) { return ROLE_LABEL_MAP[role] || "Anggota"; }

let me = {};
function escapeHtml(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
const ROLE_EDIT = { admin:{bendahara:true,footage:true,file:true}, bendahara:{bendahara:true,footage:false,file:false}, pdd:{bendahara:false,footage:true,file:true}, ketua:{bendahara:true,footage:true,file:true}, anggota:{bendahara:false,footage:false,file:false}, sekertaris:{bendahara:false,footage:false,file:false}, anggota_pj:{bendahara:false,footage:false,file:false} };
let canEditFile = false;
function logout() { localStorage.removeItem("token"); location.href = "index.html"; }

// ===== TOP-RIGHT PROFILE MENU =====
function toggleProfileMenu(e) {
  e.stopPropagation();
  document.getElementById("profileMenu").classList.toggle("open");
}
document.addEventListener("click", function (e) {
  const wrap = document.getElementById("topProfileWrap");
  const menu = document.getElementById("profileMenu");
  if (wrap && menu && !wrap.contains(e.target)) menu.classList.remove("open");
});

function fotoKey() { return "ktFotoProfil_" + (me.username || "guest"); }

function applyFotoProfil() {
  const saved = localStorage.getItem(fotoKey());
  const initial = (me.nama || "?").trim().charAt(0).toUpperCase();
  [document.getElementById("topProfileBtn"), document.getElementById("pmAvatarInit"), document.getElementById("avatarInit")].forEach(el => {
    if (!el) return;
    if (saved) { el.style.backgroundImage = "url('" + saved + "')"; el.textContent = ""; }
    else { el.style.backgroundImage = ""; el.textContent = initial; }
  });
  const topInit = document.getElementById("topAvatarInit");
  if (topInit) topInit.textContent = saved ? "" : initial;
}

const fotoProfilInputEl = document.getElementById("fotoProfilInput");
if (fotoProfilInputEl) {
  fotoProfilInputEl.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { alert("File harus berupa gambar."); return; }
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const size = 240;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        try {
          localStorage.setItem(fotoKey(), dataUrl);
          applyFotoProfil();
          document.getElementById("profileMenu").classList.remove("open");
        } catch (err) {
          alert("Gagal menyimpan foto profil (mungkin ukuran terlalu besar).");
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  });
}

function goToProfil() { sessionStorage.setItem("ktOpenProfil", "1"); location.href = "index.html"; }
function goToAdminPanel() { sessionStorage.setItem("ktOpenAdmin", "1"); location.href = "index.html"; }

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");
  const mb = document.getElementById("mobileBar");
  if (mb) mb.classList.toggle("hideForSidebar");
}

function showUploadErr(msg) {
  const b = document.getElementById("uploadErr");
  b.innerHTML = ICON.warning + msg;
  b.style.display = "block";
}
function clearUploadErr() {
  document.getElementById("uploadErr").style.display = "none";
}

async function apiGet(path) {
  const r = await fetch(API + path, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function apiUpload(path, formData) {
  const r = await fetch(API + path, { method: "POST", headers: { Authorization: "Bearer " + token }, body: formData });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function apiDelete(path) {
  const r = await fetch(API + path, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}

function fmtSize(bytes) {
  if (!bytes) return "0 KB";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
function fmtDate(iso) {
  try {
    return new Date(iso.replace(" ", "T") + "Z").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  } catch { return iso; }
}
function iconFor(mime, filename) {
  const ext = (filename.split(".").pop() || "").toLowerCase();
  if (mime?.includes("pdf") || ext === "pdf") return ["pdf", "PDF"];
  if (mime?.includes("word") || ["doc", "docx"].includes(ext)) return ["doc", "DOC"];
  if (mime?.includes("sheet") || mime?.includes("excel") || ["xls", "xlsx"].includes(ext)) return ["xls", "XLS"];
  return ["doc", "FILE"];
}

async function syncFiles() {
  clearUploadErr();
  const btn = document.getElementById("syncBtn");
  const oldHtml = btn.innerHTML;
  btn.textContent = "Menyinkronkan..."; btn.disabled = true;
  try {
    const r = await fetch(API + "/file/sync", { method: "POST", headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (r.status === 401) { logout(); return; }
    if (!r.ok) throw new Error(d.error || ("Error " + r.status));
    await loadFiles();
    alert(`Sync selesai. ${d.added} file baru ditambahkan dari Drive (total di folder Drive: ${d.total_di_drive}).`);
  } catch (err) {
    showUploadErr(err.message);
  } finally {
    btn.innerHTML = oldHtml; btn.disabled = false;
  }
}

let allFiles = [];

async function loadFiles() {
  try {
    allFiles = await apiGet("/file");
    renderFiles();
  } catch (err) {
    document.getElementById("fileList").innerHTML =
      `<div class="emptyNote"><b>Gagal memuat file</b><p>${err.message}</p></div>`;
  }
}

function renderFiles() {
  const q = (document.getElementById("fileSearch").value || "").toLowerCase();
  const rows = allFiles.filter(f => f.filename.toLowerCase().includes(q) || (f.kategori || "").toLowerCase().includes(q));
  const list = document.getElementById("fileList");
  if (rows.length === 0) {
    list.innerHTML = `<div class="emptyNote">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      <b>Belum ada file</b><p>Klik "+ Unggah File" untuk menambahkan dokumen pertama.</p>
    </div>`;
    return;
  }
  list.innerHTML = rows.map(f => {
    const [cls, label] = iconFor(f.mime_type, f.filename);
    return `<div class="fileRow">
      <div class="fIcon ${cls}">${label}</div>
      <div class="fMeta"><b>${escapeHtml(f.filename)}</b><small>${escapeHtml(f.kategori || "Umum")}</small></div>
      <div class="fRight">
        ${fmtSize(f.size)} &middot; ${fmtDate(f.uploaded_at)}
        <span class="dlBtn" onclick="downloadFile(${f.id}, ${escapeHtml(JSON.stringify(f.filename))})" title="Unduh">${ICON.download}</span>
        ${canEditFile ? `<span class="dlBtn" onclick="deleteFile(${f.id})" title="Hapus" style="color:#ef4444">${ICON.trash}</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

async function doUploadFile() {
  clearUploadErr();
  const input = document.getElementById("fileInput");
  const file = input.files[0];
  if (!file) return;
  const kategori = document.getElementById("uploadKategori").value || "Umum";
  const btn = document.getElementById("uploadBtn");
  btn.textContent = "Mengunggah..."; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("kategori", kategori);
    await apiUpload("/file", fd);
    input.value = "";
    document.getElementById("uploadKategori").value = "";
    await loadFiles();
  } catch (err) {
    showUploadErr(err.message);
  } finally {
    btn.textContent = "+ Unggah File"; btn.disabled = false;
  }
}

async function downloadFile(id, filename) {
  try {
    const r = await fetch(API + "/file/download?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || "Gagal mengunduh"); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    showUploadErr(err.message);
  }
}

// Popup konfirmasi hapus custom (menggantikan confirm() bawaan browser).
// Mengembalikan Promise<boolean>: true kalau user menekan "Hapus".
function confirmHapus(message, title) {
  return new Promise(resolve => {
    const overlay = document.getElementById("delConfirmOverlay");
    document.getElementById("delConfirmTitle").textContent = title || "Hapus item ini?";
    document.getElementById("delConfirmMsg").textContent = message || "Tindakan ini tidak bisa dibatalkan.";
    overlay.classList.add("open");
    const btnOk = document.getElementById("delConfirmOk");
    const btnCancel = document.getElementById("delConfirmCancel");
    function cleanup(result) {
      overlay.classList.remove("open");
      btnOk.removeEventListener("click", onOk);
      btnCancel.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onOverlay);
      document.removeEventListener("keydown", onKey);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onOverlay(e) { if (e.target === overlay) cleanup(false); }
    function onKey(e) { if (e.key === "Escape") cleanup(false); }
    btnOk.addEventListener("click", onOk);
    btnCancel.addEventListener("click", onCancel);
    overlay.addEventListener("click", onOverlay);
    document.addEventListener("keydown", onKey);
  });
}

async function deleteFile(id) {
  if (!(await confirmHapus("File ini akan dihapus secara permanen dan tidak bisa dikembalikan.", "Hapus file ini?"))) return;
  try {
    await apiDelete("/file?id=" + id);
    await loadFiles();
  } catch (err) {
    showUploadErr(err.message);
  }
}

// Ambil data /auth/me dengan percobaan ulang untuk error SEMENTARA. Token
// TIDAK ikut dihapus untuk error jenis ini — apiGet() sudah memanggil logout()
// dari dalam saat server benar-benar membalas 401 (token tidak valid).
async function getMeWithRetry(maxRetries = 2) {
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      return await apiGet("/auth/me");
    } catch (err) {
      if (attempt === maxRetries) throw err;
      await new Promise(res => setTimeout(res, 500 * (attempt + 1)));
    }
  }
}

// ===== INIT (ambil nama+role TERKINI dari server, bukan decode token) =====
async function initApp() {
  try {
    me = await getMeWithRetry();
  } catch (err) {
    showUploadErr((err.message || String(err)) + " Coba muat ulang halaman.");
    return;
  }

  document.getElementById("profName").textContent = me.nama;
  document.getElementById("profRole").textContent = roleLabel(me.role);
  document.getElementById("avatarInit").textContent = (me.nama || "?").trim().charAt(0).toUpperCase();

  document.getElementById("pmName").textContent = me.nama;
  document.getElementById("pmRole").textContent = roleLabel(me.role);
  document.getElementById("pmAdminBtn").style.display = (me.role === "admin" || me.role === "ketua") ? "" : "none";
  applyFotoProfil();

  canEditFile = !!(ROLE_EDIT[me.role] && ROLE_EDIT[me.role].file);
  const upBtn = document.getElementById("uploadBtn"); if (upBtn) upBtn.style.display = canEditFile ? "" : "none";
  const syncBtn = document.getElementById("syncBtn"); if (syncBtn) syncBtn.style.display = canEditFile ? "" : "none";

  loadFiles();
}
initApp();
</script>

<script>
// Cek pengumuman belum dibaca (dipanggil sekali saat halaman siap)
async function checkPengumumanBellSecondary() {
  try {
    const r = await fetch(API + "/pengumuman", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows || !rows.length) return;
    const latest = [...rows].sort((a, b) => new Date(b.dibuat_at || 0) - new Date(a.dibuat_at || 0))[0];
    const lastSeenId = localStorage.getItem("lastSeenPengumumanId");
    if (String(latest.id) === String(lastSeenId)) return;
    const dot = document.getElementById("pengumumanDot");
    if (dot) {
      dot.style.display = "block";
      dot.classList.toggle("dotKetua", latest.dibuat_oleh_role === "ketua");
    }
  } catch {}
}
checkPengumumanBellSecondary();

</script>
</body>
</html>
